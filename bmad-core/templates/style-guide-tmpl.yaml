# <!-- Powered by BMAD™ Core -->
template:
  id: style-guide-template-v1
  name: Style Guide Specification
  version: 1.0
  output:
    format: markdown
    filename: docs/ui/style-guide.md
    title: "{{project_name}} Style Guide"

workflow:
  mode: interactive
  elicitation: advanced-elicitation

sections:
  - id: introduction
    title: Style Guide
    instruction: |
      Review the project brief, design documentation, and existing brand guidelines. This style guide defines the visual design language for the application and ensures consistency across all UI elements.
    content: |
      ## {{project_name}}

      This style guide defines the visual design language for the {{project_name}} application. It provides specifications for colors, typography, spacing, components, and visual elements to ensure consistency across the entire application.
    sections:
      - id: table-of-contents
        title: Table of Contents
        type: bullet-list
        instruction: Auto-generated from section titles

      - id: brand-identity
        title: Brand Identity
        instruction: |
          Establish the brand foundation by defining:
          1. Target audience segments
          2. Brand personality traits
          3. Core design philosophy

          Work with stakeholders to articulate what makes this brand unique.
        elicit: true
        sections:
          - id: target-audience
            title: Target Audience
            template: |
              - **Primary:** {{primary_audience}}
              - **Secondary:** {{secondary_audience}}
              - **Tertiary:** {{tertiary_audience}}
          - id: brand-personality
            title: Brand Personality
            template: |
              - **{{trait_1}}** yet {{contrast_1}}
              - **{{trait_2}}** with {{quality_1}}
              - **{{trait_3}}** and {{quality_2}}
              - **{{trait_4}}** but not {{avoidance_1}}
              - **{{trait_5}}** and {{quality_3}}
          - id: design-philosophy
            title: Design Philosophy
            template: "{{design_philosophy_description}}"

  - id: color-system
    title: Color System
    instruction: |
      Define the complete color system using HSL format for consistency.

      1. Primary colors (brand identity)
      2. Semantic colors (success, error, warning)
      3. Neutral colors (backgrounds, text)
      4. UI element colors (cards, sidebars, etc.)
      5. Gradients and special effects

      Include usage guidelines and accessibility considerations.
    elicit: true
    content: |
      All colors are defined using HSL (Hue, Saturation, Lightness) format for consistency and easy manipulation. Colors are accessed via CSS custom properties.
    sections:
      - id: primary-colors
        title: Primary Colors
        repeatable: true
        sections:
          - id: primary-color
            title: "{{color_name}}"
            template: |
              **Purpose**: {{color_purpose}}

              ```css
              {{css_variables}}
              ```

              **Usage**:
              - {{usage_1}}
              - {{usage_2}}
              - {{usage_3}}
              - {{usage_4}}

              **Visual**:
              - Base: `{{base_hsl}}` - {{base_description}}
              - Hover: {{hover_description}}
              - Light: {{light_description}}

      - id: semantic-colors
        title: Semantic Colors
        repeatable: true
        sections:
          - id: semantic-color
            title: "{{semantic_color_name}}"
            template: |
              **Purpose**: {{semantic_purpose}}

              ```css
              {{semantic_css_variables}}
              ```

              **Usage**:
              - {{semantic_usage_1}}
              - {{semantic_usage_2}}
              - {{semantic_usage_3}}
              - {{semantic_usage_4}}

      - id: neutral-colors
        title: Neutral Colors
        repeatable: true
        sections:
          - id: neutral-section
            title: "{{neutral_section_name}}"
            template: |
              ```css
              {{neutral_css_variables}}
              ```

              **Usage**:
              - {{neutral_usage_1}}
              - {{neutral_usage_2}}
              - {{neutral_usage_3}}

      - id: ui-element-colors
        title: UI Element Colors
        repeatable: true
        sections:
          - id: ui-color
            title: "{{ui_element_name}}"
            template: |
              ```css
              {{ui_css_variables}}
              ```

      - id: gradients
        title: Gradients
        template: |
          Pre-defined gradient combinations:

          ```css
          {{gradient_definitions}}
          ```

          **Usage Classes**:
          ```tsx
          {{gradient_usage_examples}}
          ```

      - id: color-guidelines
        title: Color Usage Guidelines
        template: |
          #### Do's:
          {{dos_list}}

          #### Don'ts:
          {{donts_list}}

